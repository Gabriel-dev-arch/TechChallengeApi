services:
  db:
    image: postgres:17-alpine
    container_name: oficina-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./oficina
    container_name: oficina-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?defina ADMIN_USERNAME no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      CLIENTE_USERNAME: ${CLIENTE_USERNAME:?defina CLIENTE_USERNAME no .env}
      CLIENTE_PASSWORD: ${CLIENTE_PASSWORD:?defina CLIENTE_PASSWORD no .env}
      CLIENTE_DOCUMENTO: ${CLIENTE_DOCUMENTO:?defina CLIENTE_DOCUMENTO no .env}
    ports:
      - "${APP_PORT:-8080}:8080"

  # Analise de qualidade de codigo (SonarQube). Sobe somente sob demanda:
  #   docker compose --profile qualidade up -d sonarqube
  # Usa o banco embutido do proprio SonarQube; nao depende do banco da aplicacao.
  sonarqube:
    image: sonarqube:community
    container_name: oficina-sonarqube
    profiles: ["qualidade"]
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  oficina-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
