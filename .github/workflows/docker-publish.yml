name: Build and Push to GHCR

on:
  push:
  pull_request:
    branches: [ main, develop, 'release/**' ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven local repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Maven tests
        working-directory: oficina
        run: mvn -B test

      - name: Run PMD report
        working-directory: oficina
        run: mvn -B pmd:pmd

      - name: Run SpotBugs report
        working-directory: oficina
        run: mvn -B spotbugs:spotbugs

      - name: Run Checkstyle report
        working-directory: oficina
        run: mvn -B checkstyle:checkstyle

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: oficina/target

      - name: Set image tag and repo
        run: |
          if [ -n "$GITHUB_HEAD_REF" ]; then BRANCH="$GITHUB_HEAD_REF"; else BRANCH="${GITHUB_REF#refs/heads/}"; fi
          TAG=$(echo "$BRANCH" | tr '/' '-')
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=$REPO_LOWER" >> $GITHUB_ENV

      - name: Build and push (branch and sha)
        uses: docker/build-push-action@v4
        with:
          context: ./oficina
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }},ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Push latest (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v4
        with:
          context: ./oficina
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}:latest

      - name: Start SonarQube (Docker)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker pull sonarqube:lts-community
          docker run -d --name sonarqube-ci --memory=4g --ulimit nofile=65536:65536 -p 9000:9000 sonarqube:lts-community
          echo "Waiting for SonarQube (health check)..."
          status=""
          http_code=""
          for i in $(seq 1 12); do
            # anonymous health-check
            http_code=$(curl -sS -o /tmp/sonar_health -w "%{http_code}" http://127.0.0.1:9000/api/system/health || echo "000")
            status=$(cat /tmp/sonar_health 2>/dev/null || echo "")
            # admin-auth status check (use default admin:admin to validate readiness even when anon is blocked)
            admin_code=$(curl -sS -o /tmp/sonar_admin_status -w "%{http_code}" -u admin:admin http://127.0.0.1:9000/api/system/status || echo "000")
            admin_status=$(cat /tmp/sonar_admin_status 2>/dev/null || echo "")

            echo "Waiting for Sonar... ($i/12) - anon HTTP $http_code - admin HTTP $admin_code"
            echo "Anonymous: $status"
            echo "Admin: $admin_status"

            if { [ "$http_code" = "200" ] && echo "$status" | grep -qE '\"status\":\"GREEN\"|\"status\":\"UP\"'; } || { [ "$admin_code" = "200" ] && echo "$admin_status" | grep -qE '\"status\":\"GREEN\"|\"status\":\"UP\"'; }; then
              echo "Sonar ready (detected via anon or admin check)"
              break
            fi

            sleep 5
          done

          if ! { [ "$http_code" = "200" ] && echo "$status" | grep -qE '\"status\":\"GREEN\"|\"status\":\"UP\"'; } && ! { [ "$admin_code" = "200" ] && echo "$admin_status" | grep -qE '\"status\":\"GREEN\"|\"status\":\"UP\"'; }; then
            echo "Sonar did not become ready in time; dumping logs:";
            docker logs --tail 200 sonarqube-ci || true
            docker inspect sonarqube-ci || true
            if [ -z "${SONAR_TOKEN}" ]; then
              echo "SONAR_TOKEN is not set in the runner environment."
            else
              echo "SONAR_TOKEN is set but was NOT used for health-check. Token may not be valid for this ephemeral Sonar instance."
            fi
            exit 1
          fi

          echo "SonarQube is ready."

          # If SONAR_TOKEN is not provided, create a temporary token using default admin credentials
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN not provided — creating temporary token using default admin:admin"
            token_name="gh-actions-$(date +%s)"
            resp=$(curl -sS -u admin:admin -X POST "http://127.0.0.1:9000/api/user_tokens/generate?name=${token_name}")
            token=$(echo "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin).get('token',''))") || token=""
            if [ -n "$token" ]; then
              # Persist token to subsequent steps
              echo "SONAR_TOKEN=$token" >> $GITHUB_ENV
              export SONAR_TOKEN="$token"
              echo "Temporary SONAR token created and written to GITHUB_ENV."
            else
              echo "Failed to create temporary SONAR token; response: $resp"
            fi
          fi

      - name: Sonar debug checks
        if: always()
        run: |
          echo "SONAR_TOKEN set? $(if [ -n "${SONAR_TOKEN}" ]; then echo yes; else echo no; fi)"
          echo "------ Anonymous HEAD (headers) ------"
          curl -sS -I http://127.0.0.1:9000/api/system/health || true
          echo "------ Anonymous body ------"
          curl -sS http://127.0.0.1:9000/api/system/health || true
          if [ -n "${SONAR_TOKEN}" ]; then
            echo "------ Authenticated health check (body only; token not printed) ------"
            auth_code=$(curl -sS -o /tmp/sonar_auth_health -w "%{http_code}" -u "${SONAR_TOKEN}:" http://127.0.0.1:9000/api/system/health || echo "000")
            cat /tmp/sonar_auth_health || true
            echo "Authenticated HTTP code: $auth_code"
          else
            echo "SONAR_TOKEN not set; skipping authenticated check"
          fi
          echo "------ Docker logs (tail 500) ------"
          docker logs --tail 500 sonarqube-ci || true
          echo "------ Docker inspect ------"
          docker inspect sonarqube-ci || true

      - name: Stop SonarQube
        run: |
          docker stop sonarqube-ci || true
          docker rm sonarqube-ci || true
