request:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ''
        method: jsonq
      variable:
        name: token_autenticacao
        scope: runtime
  scripts:
    - type: after-response
      code: |-
        // 1. Garante que existe uma resposta da requisição
        if (bru.response) {
          
          // 2. Tenta extrair o JSON da resposta
          const resposta = bru.response.getJson();
          
          // 3. Verifica se o JSON existe e se o token veio no corpo
          if (resposta && resposta.accessToken) {
            bru.setEnvVar("token_autenticacao", resposta.accessToken);
            console.log("Token salvo com sucesso!");
          } else {
            console.error("Campo 'token_autenticacao' não encontrado na resposta:", resposta);
          }

        } else {
          console.error("Nenhuma resposta recebida do servidor. Verifique a conexão ou a URL.");
        }
bundled: true
extensions:
